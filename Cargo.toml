[workspace]
resolver = "2"
members = [
    "broker",
    "storage",
    "protocol",
    "client",
    "common",
    "examples",
]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
memmap2 = "0.9"
crc32fast = "1.3"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
